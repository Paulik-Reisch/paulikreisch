# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Triggering a rebuild to solve a build config issue.

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  secrets:
    - secret: MAILERSEND_API_KEY
    - secret: MAILERSEND_GROUP_ID
buildConfig:
  memoryMiB: 2048

# Session signing key: value remains in Google Secret Manager.
env:
  - variable: SESSION_SECRET
    secret: SESSION_SECRET@1
    availability:
      - RUNTIME
  # OpenRouter key for Worthaft word definitions: value remains in Google
  # Secret Manager. Merge only after the secret exists and is granted.
  - variable: OPENROUTER_API_KEY
    secret: OPENROUTER_API_KEY@1
    availability:
      - RUNTIME
  - variable: PRIVATE_ASSET_RELEASE
    value: "private-prefix-v1-accepted"
    availability:
      - RUNTIME
  - variable: WORTHAFT_DAILY_RELEASE
    value: "persistent-v1-accepted"
    availability:
      - RUNTIME
  - variable: PRIVATE_ASSET_ACCEPTANCE_NONCE
    value: "c4ff5129ab7241a0a85ab684"
    availability:
      - RUNTIME
  - variable: PRIVATE_ASSET_ACCEPTANCE_EXPIRES
    value: "2026-11-13T18:00:00.000Z"
    availability:
      - RUNTIME

  # Accepted isolated shortlinks on the existing private Storage prefix.
  - variable: SHORT_LINK_RELEASE
    value: private-prefix-v1-accepted
    availability:
      - RUNTIME

  # Isolated marketing Auth key; public identifier, host/API restricted.
  - variable: MARKETING_FIREBASE_API_KEY
    value: AIzaSyDwLVfnlwtxZle7wlwNFR61DXkgggyeOLw
    availability:
      - RUNTIME
  - variable: MARKETING_STUDIO_RELEASE
    value: structured-v1-accepted
    availability:
      - RUNTIME

  # Newsletter (Resend). Values stay in Secret Manager. All newsletter flags
  # (NEWSLETTER_STORE_ENABLED, NEWSLETTER_SEND_ENABLED, NEWSLETTER_FUNNEL_DAY0)
  # are deliberately NOT set: unset means off and the routes fail closed.
  # Feedback is removal-only and independent of public signup/sending.
  - variable: NEWSLETTER_TOKEN_SECRET
    secret: NEWSLETTER_TOKEN_SECRET@1
    availability:
      - RUNTIME
  - variable: NEWSLETTER_ID_KEY
    secret: NEWSLETTER_ID_KEY@1
    availability:
      - RUNTIME
  - variable: NEWSLETTER_RESEND_API_KEY
    secret: NEWSLETTER_RESEND_API_KEY@1
    availability:
      - RUNTIME

  # Sender identity approved 2026-11-16. Configuration only, no send gate enabled.
  - variable: NEWSLETTER_FROM
    value: "Paulik & Reisch <newsletter@news.paulikreisch.de>"
    availability:
      - RUNTIME
  - variable: NEWSLETTER_REPLY_TO
    value: philipp.l.paulik@gmail.com
    availability:
      - RUNTIME
  - variable: NEWSLETTER_BASE_URL
    value: https://paulikreisch.de
    availability:
      - RUNTIME

  # Removal only: does not enable registration, confirmation or sending.
  - variable: NEWSLETTER_UNSUBSCRIBE_ENABLED
    value: "1"
    availability:
      - RUNTIME

  # Only signed existing-recipient suppression. No signup or sending.
  - variable: NEWSLETTER_RESEND_WEBHOOK_SECRET
    secret: NEWSLETTER_RESEND_WEBHOOK_SECRET@1
    availability:
      - RUNTIME
  - variable: NEWSLETTER_FEEDBACK_ENABLED
    value: "1"
    availability:
      - RUNTIME

  # Approved fixed single-recipient technical probe only. Durable claim forbids retries.
  - variable: NEWSLETTER_TRANSPORT_TEST_ENABLED
    value: "1"
    availability:
      - RUNTIME
