name: CodeQL
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    # Private repositories need GitHub Code Security to run this workflow.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504 # v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
