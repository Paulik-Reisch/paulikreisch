name: CodeQL
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    # Private repositories need GitHub Code Security to run this workflow.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504 # v3
